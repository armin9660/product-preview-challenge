<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
   <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
<link rel="icon" type="image/png" sizes="32x32" href="./assests/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
 
</head>
<body>
  <main>
<article class="card-container">
  <section class="image-container">
    <img class="product-image" src="assets/images/image-product-desktop.jpg" alt="product image">

  </section>
  <section class="product-details">
    <p class="perfume">Perfume</p>

  <h1 class="product-name">Gabrielle Essence Eau De Parfum</h1>

  <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>

  <div class="prices">
    <span class="price">$149.99</span>
    <span class="price-discount">$169.99</span>
  </div>
  <button class="add-btn">
    <span><img src="assets/images/icon-cart.svg" alt="buy icon"></span>
    Add to Cart
  </button>
  </section>
  </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/armin9660">Armin TH</a>
  </footer>
</body>
</html>
